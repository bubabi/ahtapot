[package]
name = "ahtapot"
version = "0.1.1"
description = "A git client"
license = "MIT"
authors = ["Burak Emre Özer"]
edition = "2021"


[lib]
name = "ahtapot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
portable-pty = "0.9"
notify = "8"
ureq = { version = "3", features = ["json"] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }


[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
